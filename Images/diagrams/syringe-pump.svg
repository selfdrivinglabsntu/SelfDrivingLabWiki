<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 445" width="760" height="445" role="img"
     aria-label="Side section through a lead-screw syringe pump: a stepper motor bolted to the left end plate drives a lead screw through a flexible coupler; an anti-backlash nut carries a plunger carriage along the screw and a guide rod, and the carriage pushes the syringe plunger into a barrel clamped in the right end plate, forcing the liquid out through the luer-lock tip into the tubing.">
  <title>Lead-screw syringe pump in side section, from stepper motor through carriage and syringe to the outlet tubing</title>

  <defs>
    <!-- section hatch: marks the end plates as cut solid material, so the bores
         the rod, screw and barrel pass through read as holes in a plate rather
         than as gaps between separate parts -->
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#B4BCC8" stroke-width="1.1"/>
    </pattern>
    <!-- screw thread: one repeating flank, so the lead screw reads as threaded
         rod at any length without hand-placing every line -->
    <pattern id="thread" width="12" height="16" patternUnits="userSpaceOnUse">
      <line x1="0" y1="16" x2="8" y2="0" stroke="#FFFFFF" stroke-width="2.2" opacity=".45"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="760" height="445" rx="8" fill="#FFFFFF"/>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">

    <!-- end plates, sectioned: the left one carries the motor, the right one
         clamps the syringe's finger flange and bears the far end of the screw.
         The right plate is drawn as two pieces so the gap between them is the
         bore the barrel passes through. -->
    <g stroke="#1F2530" stroke-width="2.5" stroke-linejoin="round">
      <g fill="#EDF0F4">
        <rect x="128" y="106" width="24" height="252" rx="2"/>
        <rect x="500" y="106" width="26" height="38" rx="2"/>
        <rect x="500" y="216" width="26" height="142" rx="2"/>
      </g>
      <g fill="url(#hatch)">
        <rect x="128" y="106" width="24" height="252" rx="2"/>
        <rect x="500" y="106" width="26" height="38" rx="2"/>
        <rect x="500" y="216" width="26" height="142" rx="2"/>
      </g>
    </g>

    <!-- stepper motor, bolted to the outside face of the left plate -->
    <rect x="40" y="224" width="88" height="112" rx="3" fill="#39404E" stroke="#1F2530" stroke-width="2.5"/>
    <rect x="48" y="240" width="72" height="4" rx="2" fill="#4A525F"/>
    <rect x="48" y="316" width="72" height="4" rx="2" fill="#4A525F"/>
    <g fill="#5B6472">
      <circle cx="140" cy="248" r="5"/>
      <circle cx="140" cy="314" r="5"/>
      <circle cx="513" cy="124" r="5"/>
      <circle cx="513" cy="330" r="5"/>
    </g>

    <!-- motor shaft through the plate bore, then the coupler onto the screw -->
    <rect x="128" y="272" width="48" height="16" fill="#9AA3AF" stroke="#1F2530" stroke-width="2"/>
    <rect x="176" y="262" width="48" height="36" rx="3" fill="#0071E3" stroke="#0A4F94" stroke-width="2.5"/>
    <g stroke="#0A4F94" stroke-width="2">
      <line x1="188" y1="262" x2="188" y2="298"/>
      <line x1="212" y1="262" x2="212" y2="298"/>
    </g>

    <!-- bearing seat in the right plate, carrying the far end of the screw -->
    <rect x="498" y="264" width="30" height="32" rx="2" fill="#EDF0F4" stroke="#1F2530" stroke-width="2"/>

    <!-- lead screw -->
    <rect x="224" y="272" width="288" height="16" fill="#0071E3" stroke="#0A4F94" stroke-width="2"/>
    <rect x="224" y="272" width="288" height="16" fill="url(#thread)"/>

    <!-- guide rod, through bores in both plates: it stops the carriage turning
         with the screw, so the nut can only travel along it -->
    <rect x="152" y="234" width="390" height="14" rx="7" fill="#39404E" stroke="#1F2530" stroke-width="2"/>
    <line x1="160" y1="238" x2="534" y2="238" stroke="#5F6875" stroke-width="2"/>

    <!-- syringe: barrel through the right plate's bore, finger flange butted
         against the plate's inner face so the barrel cannot be pushed out -->
    <rect x="490" y="144" width="148" height="72" fill="#FFFFFF"/>
    <g stroke="#1F2530" stroke-width="2.5">
      <line x1="490" y1="144" x2="638" y2="144"/>
      <line x1="490" y1="216" x2="638" y2="216"/>
    </g>
    <g stroke="#5B6472" stroke-width="1.6">
      <line x1="556" y1="144" x2="556" y2="154"/>
      <line x1="570" y1="144" x2="570" y2="154"/>
      <line x1="584" y1="144" x2="584" y2="154"/>
      <line x1="598" y1="144" x2="598" y2="154"/>
      <line x1="612" y1="144" x2="612" y2="154"/>
      <line x1="626" y1="144" x2="626" y2="154"/>
    </g>
    <rect x="576" y="148" width="62" height="64" fill="#A9E5D6"/>
    <path d="M638 144 L666 172 L666 188 L638 216 Z" fill="#A9E5D6" stroke="#1F2530" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="666" y="164" width="20" height="32" rx="2" fill="#EDF0F4" stroke="#1F2530" stroke-width="2.5"/>
    <path d="M686 180 H708 C732 180 738 192 738 212 V352" fill="none" stroke="#39404E" stroke-width="11" stroke-linecap="round"/>
    <path d="M686 180 H708 C732 180 738 192 738 212 V352" fill="none" stroke="#5F6875" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <rect x="484" y="130" width="16" height="100" rx="2" fill="#EDF0F4" stroke="#1F2530" stroke-width="2.5"/>

    <!-- plunger: rod and seal inside the barrel, thumb flange outside it, sat
         against the carriage's face -->
    <rect x="366" y="170" width="190" height="20" fill="#EDF0F4" stroke="#1F2530" stroke-width="2"/>
    <rect x="552" y="148" width="24" height="64" rx="2" fill="#39404E" stroke="#1F2530" stroke-width="2"/>
    <rect x="352" y="146" width="14" height="68" rx="2" fill="#EDF0F4" stroke="#1F2530" stroke-width="2.5"/>

    <!-- carriage, with the anti-backlash nut captured in it and standing a
         little proud of its underside -->
    <rect x="300" y="124" width="52" height="166" rx="4" fill="#CFE4FA" stroke="#0071E3" stroke-width="2.5"/>
    <rect x="296" y="262" width="60" height="36" rx="3" fill="#7FB4E8" stroke="#0A4F94" stroke-width="2.5"/>

    <!-- the mechanism: screw rotation becomes carriage travel becomes volume -->
    <g stroke="#0071E3" fill="#0071E3">
      <line x1="372" y1="160" x2="466" y2="160" stroke-width="3.5"/>
      <polygon points="480,160 466,153 466,167" stroke="none"/>
    </g>
    <rect x="155" y="143" width="142" height="46" rx="4" fill="#FFFFFF" opacity=".9"/>
    <g font-size="16" font-weight="600" fill="#0071E3" text-anchor="end">
      <text x="292" y="160">screw turns,</text>
      <text x="292" y="182">plunger advances</text>
    </g>

    <!-- callouts -->
    <g stroke="#5B6472" stroke-width="1.5" fill="#5B6472">
      <line x1="300" y1="40" x2="318" y2="116"/>
      <circle cx="320" cy="120" r="3" stroke="none"/>
      <line x1="556" y1="40" x2="562" y2="132"/>
      <circle cx="563" cy="136" r="3" stroke="none"/>
      <line x1="688" y1="40" x2="679" y2="152"/>
      <circle cx="678" cy="156" r="3" stroke="none"/>
      <line x1="84" y1="410" x2="84" y2="344"/>
      <circle cx="84" cy="340" r="3" stroke="none"/>
      <line x1="250" y1="410" x2="208" y2="304"/>
      <circle cx="205" cy="300" r="3" stroke="none"/>
      <line x1="440" y1="410" x2="338" y2="306"/>
      <circle cx="334" cy="302" r="3" stroke="none"/>
      <line x1="430" y1="314" x2="430" y2="294"/>
      <circle cx="430" cy="292" r="3" stroke="none"/>
      <line x1="546" y1="241" x2="538" y2="241"/>
      <circle cx="536" cy="241" r="3" stroke="none"/>
      <line x1="544" y1="285" x2="528" y2="285"/>
      <circle cx="524" cy="285" r="3" stroke="none"/>
      <line x1="666" y1="351" x2="726" y2="351"/>
      <circle cx="730" cy="351" r="3" stroke="none"/>
      <line x1="430" y1="202" x2="430" y2="196"/>
      <circle cx="430" cy="194" r="3" stroke="none"/>
    </g>
    <g fill="#FFFFFF" opacity=".9">
      <rect x="378" y="206" width="104" height="20" rx="4"/>
      <rect x="378" y="314" width="104" height="20" rx="4"/>
    </g>
    <g font-size="17" font-weight="600" fill="#1F2530">
      <text x="300" y="32" text-anchor="middle">Plunger carriage</text>
      <text x="556" y="32" text-anchor="middle">Syringe barrel</text>
      <text x="688" y="32" text-anchor="middle">Luer-lock tip</text>
      <text x="84" y="420" text-anchor="middle">Stepper motor</text>
      <text x="250" y="420" text-anchor="middle">Flexible coupler</text>
      <text x="440" y="420" text-anchor="middle">Anti-backlash nut</text>
      <text x="430" y="330" text-anchor="middle">Lead screw</text>
      <text x="552" y="247">Linear guide rod</text>
      <text x="548" y="290">Barrel clamp</text>
      <text x="660" y="356" text-anchor="end">Tubing</text>
      <text x="430" y="222" text-anchor="middle">Plunger rod</text>
    </g>
    <text x="606" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B55">liquid</text>

  </g>
</svg>
